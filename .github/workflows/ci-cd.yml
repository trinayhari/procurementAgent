name: CI/CD

# CI runs on every PR to main and on pushes to main.
# CD (deploy) runs only on pushes to main, after all CI jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ CI
  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci # respects .npmrc (legacy-peer-deps=true)
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend · tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Import app (no secrets needed — config has safe defaults)
        run: python -c "import app.main; print('app import OK')"
      - name: Apply Alembic migrations against a throwaway SQLite DB
        env:
          PROCUREAI_DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head
      - name: Run backend test suite (mock providers enforced by conftest)
        run: python -m pytest tests -q
      - name: Production config guard refuses the default JWT secret
        run: |
          if PROCUREAI_ENV=production python -c "import app.main" 2>/dev/null; then
            echo "::error::app booted in production mode with the default JWT secret"
            exit 1
          fi
          echo "Guard OK: production boot refused without a real secret."

  api-types-sync:
    name: API types in sync (openapi.json + api-types.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -r apps/api/requirements.txt
      - run: npm ci
      - name: Regenerate and verify nothing drifted
        run: |
          PYTHON=python npm run gen:api
          if ! git diff --quiet -- apps/api/openapi.json apps/web/src/api-types.ts; then
            echo "::error::apps/api/openapi.json or apps/web/src/api-types.ts is stale. Run 'npm run gen:api' and commit the result."
            git --no-pager diff -- apps/api/openapi.json apps/web/src/api-types.ts | head -200
            exit 1
          fi
          echo "API types are in sync."

  # ------------------------------------------------------------------ CD
  deploy-frontend:
    name: Deploy frontend → Vercel
    needs: [frontend, backend, api-types-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy backend → Railway
    needs: [frontend, backend, api-types-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # NOTE: `railway up` runs from the REPO ROOT (no working-directory here) so
    # the uploaded build context is rooted the same way as a GitHub-triggered
    # deploy. That makes the service's dashboard "Root Directory" setting
    # (apps/api) correct for both paths — uploading from apps/api instead would
    # need Root Directory to be empty, and the two would silently disagree.
    # Root .railwayignore keeps the upload small.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @railway/cli
      - name: Deploy (runs alembic + uvicorn per apps/api/railway.json)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }} # optional; needed only if the project has >1 service
        run: |
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE"
          else
            railway up
          fi
