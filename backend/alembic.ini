# Alembic configuration for the Proq backend.
# The database URL is read from app settings in migrations/env.py (this value is a
# placeholder and is overridden at runtime), so PROCUREAI_DATABASE_URL applies here too.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./procureai.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
